<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pharma Explorer — Periodic Table & Advanced Excipients Edition</title>
    <style>
      :root{
        --bg:#f8fafc;  --panel:#d9d9d9; --panel2:#fff; --border:#b6b6bd; --ink:#1b1b1a; --muted:#64748b; --faint:#6c6c6c;
        --sky:#0ea5e9; --sky-50:#f0f9ff; --sky-400:#38bdf8;
        --warn-bg:#fef2f2; --warn-border:#fecaca; --warn-text:#991b1b;
        --on-ink:#ffffff;
        --radius:10px;
      }
      [data-theme="dark"]{
        --bg:#0f172a; --panel:#1e293b; --panel2:#1e293b; --border:#334155; --ink:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
        --sky:#38bdf8; --sky-50:#0c2a4a; --sky-400:#0ea5e9;
        --warn-bg:#450a0a; --warn-border:#991b1b; --warn-text:#fecaca;
        --on-ink:#0f172a;
      }
      
      *{box-sizing:border-box;transition:background-color .3s ease,color .3s ease,border-color .3s ease}
      html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
        font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        -webkit-font-smoothing:antialiased}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .wrap{max-width:1240px;margin:0 auto;padding:22px 22px 60px}
      header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
      .brand{flex:1;min-width:260px}
      h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
      .sub{font-size:13px;color:var(--faint);margin:4px 0 0}
      
      .header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      
      .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px}
      .seg button{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
      .seg button.on{background:var(--ink);color:var(--on-ink)}
      
      .search{min-width:220px;max-width:300px;position:relative;flex:1}
      .search input{width:100%;height:42px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
        padding:0 14px 0 38px;font-size:14px;color:var(--ink);outline:none}
      .search input:focus{border-color:var(--sky-400);box-shadow:0 0 0 3px var(--sky-50)}
      .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
      
      .theme-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--border);background:var(--panel);border-radius:10px;cursor:pointer;color:var(--muted);transition:all .15s;flex-shrink:0}
      .theme-btn:hover{color:var(--ink);border-color:var(--faint)}
      .theme-btn .i-moon{display:none}
      [data-theme="dark"] .theme-btn .i-sun{display:none}
      [data-theme="dark"] .theme-btn .i-moon{display:inline-block}

      .layout{display:grid;grid-template-columns:1fr 400px;gap:18px;align-items:start}
      @media (max-width:900px){.layout{grid-template-columns:1fr}}
      .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
      
      .legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
      .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
        border-radius:999px;padding:5px 11px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none}
      .chip .dot{width:9px;height:9px;border-radius:3px}
      .chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
      .chip.muted{opacity:.4}

      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
      .tile{position:relative;border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:12px;
        cursor:pointer;text-align:left;transition:transform .16s, box-shadow .16s, border-color .3s;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
      .tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,23,42,.08);border-color:var(--sky-400)}
      .tile.sel{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky-50), 0 10px 22px rgba(14,165,233,.18)}
      .tile .element-header{display:flex;justify-content:space-between;align-items:flex-start}
      .tile .code{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1;font-family:ui-monospace,monospace;color:var(--ink)}
      .tile .cat-indicator{width:8px;height:8px;border-radius:50%}
      .tile .nm{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.2;
        overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
      .tile .cat{font-size:8px;color:var(--faint);margin-top:auto;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .tile.dim{opacity:.28}

      aside{position:sticky;top:18px}
      @media (max-width:900px){aside{position:static}}
      .badge{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:10px;font-size:16px;font-weight:700;letter-spacing:-.02em;color:#1b1b1a;flex-shrink:0;font-family:ui-monospace,monospace}
      .det-head{display:flex;gap:12px;align-items:center}
      .det-head h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0;color:var(--ink)}
      .det-head .forms{font-size:11px;color:var(--faint);margin-top:3px}
      .det-head .cat{font-size:11px;color:var(--sky);font-weight:600;margin-top:2px}
      .h3{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:16px 0 6px;font-weight:600}
      .p{font-size:13px;line-height:1.55;color:var(--ink);margin:0}
      .versions{margin:0;padding:0;list-style:none}
      .versions li{font-size:13px;color:var(--ink);padding:6px 0 6px 16px;position:relative;border-bottom:1px dashed var(--border);line-height:1.4}
      .versions li:last-child{border-bottom:0}
      .versions li:before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--sky-400)}
      .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
      .tag{border:1px solid var(--border);background:var(--panel);border-radius:7px;padding:4px 9px;font-size:11px;color:var(--muted)}
      .tag.bcs{border-color:var(--sky);color:var(--sky);font-weight:600}
      .tag.link{cursor:pointer;border-color:var(--sky-400);background:var(--sky-50);color:var(--sky-400);transition:all .15s}
      .tag.link:hover{background:var(--sky-50);border-color:var(--sky-400)}
      .note{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 8px;
        background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
      .warn-box{font-size:12px;color:var(--warn-text);line-height:1.5;margin:12px 0;
        background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:8px;padding:10px 12px}
      .warn-box strong{display:block;margin-bottom:2px;font-weight:600}
      .empty{padding:40px 10px;text-align:center;color:var(--faint);font-size:13px}
      .hint{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.5}
      .pill{display:inline-block;font-size:10px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--muted);margin-right:5px}
      .mod-abbr{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;color:var(--sky-400)}
      .mod-list .mod-nm{color:var(--ink)}

      .grades-container{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
      @media (max-width:900px){.grades-container{grid-template-columns:1fr}}
      .grades-list{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;max-height:650px;overflow-y:auto}
      .grade-item{padding:12px 14px;margin-bottom:6px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--panel);transition:all .15s;display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-size:13px}
      .grade-item:hover{background-color:var(--sky-50);border-color:var(--sky-400)}
      .grade-item.active{background-color:var(--sky-50);border-color:var(--sky);font-weight:600;color:var(--sky)}
      .grade-badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--border);font-weight:600}
      .grade-item.active .grade-badge{background:var(--sky);color:#fff;border-color:var(--sky)}
      .grade-details-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;min-height:450px;color:var(--ink)}
      .meta-box{background:var(--sky-50);border:1px solid var(--border);color:var(--sky);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;display:inline-block}
      .tag.api-tag{background:var(--sky-50);border-color:var(--sky-400);color:var(--sky)}
      .persian-box{background:var(--bg);border-left:3px solid var(--sky);padding:10px 14px;border-radius:6px;margin-top:22px;font-size:13px;line-height:1.8;color:var(--ink);direction: rtl;}
      .persian-box strong{color:var(--sky)}

      [data-theme="dark"] .tile .code,[data-theme="dark"] .det-head h2,[data-theme="dark"] h1{color:#fff}
    </style>
  </head>
  <body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Pharma Explorer</h1>
        <p class="sub">Active pharmaceutical ingredients, excipients & analytical chemical grades — Periodic Table Edition.</p>
      </div>
      
      <div class="header-controls">
        <button id="theme" class="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>

        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="text" placeholder="Search by name, code, or category…" />
        </div>

        <div class="seg" id="seg">
          <button class="on" data-view="api">APIs</button>
          <button data-view="exc">Excipients</button>
          <button data-view="grades">Pharma Grades</button>
        </div>
      </div>
    </header>

    <div class="layout" id="main-layout">
      <div>
        <div class="panel">
          <div class="legend" id="legend"></div>
          <div class="grid" id="grid"></div>
        </div>
        <p class="hint" id="hint"></p>
      </div>
      <aside>
        <div class="panel" id="detail">
          <div class="empty">Select an item to see its details.</div>
        </div>
      </aside>
    </div>

    <div class="grades-container" id="grades-layout" style="display:none;">
      <div class="grades-list" id="gradesList"></div>
      <div class="grade-details-panel" id="gradeDetailsBox"></div>
    </div>
  </div>

  <script>
    const INCOMPATIBILITIES = [
      { api: "AML", exc: "LAC", reason: "Maillard Reaction: Amlodipine is a primary amine and reacts with lactose (a reducing sugar), causing severe brown discoloration and drug degradation." },
      { api: "LIS", exc: "LAC", reason: "Maillard Reaction: Lisinopril contains a primary amine group which reacts with lactose over time." },
      { api: "ASA", exc: "MgSt", reason: "Alkaline Hydrolysis: Magnesium stearate is basic and accelerates the degradation of Aspirin into salicylic acid and acetic acid in moist conditions." },
      { api: "ASA", exc: "CaSt", reason: "Alkaline Hydrolysis: Calcium stearate is basic and can accelerate the degradation of Aspirin in moist conditions similar to magnesium stearate." },
      { api: "ASA", exc: "H2O", reason: "Hydrolysis: Aspirin rapidly hydrolyzes in water and liquid vehicles; requires dry processing or moisture protection." }
    ];

    const API = [
      { code:"PCM", name:"Paracetamol (Acetaminophen)", cat:"Analgesic / Antipyretic", bcs:"Class I (High Sol, High Perm)", forms:["Tablet","Syrup","IV infusion"],
        explain:"Relieves mild pain and lowers fever by blocking COX enzymes mainly in the brain, with little anti-inflammatory effect.",
        versions:["Standard immediate-release tablets","Oral suspension (paediatric)","IV perfalgan for hospital use","Extended-release formulation"],
        fields:["Pain","Fever","Headache"],
        excipNote:"Tablets need a binder and disintegrant to form and break apart, plus a lubricant so they don't stick to presses; syrups need a preservative and sweetener.",
        excipTags:["MCC","LAC","MgSt","SUC","BKC","cPVP","cSiO2"] },

      { code:"IBU", name:"Ibuprofen", cat:"NSAID", bcs:"Class II (Low Sol, High Perm)", forms:["Tablet","Gel","Capsule"],
        explain:"A non-steroidal anti-inflammatory that blocks COX-1 and COX-2, lowering prostaglandins to ease pain, fever and inflammation.",
        versions:["Ibuprofen lysinate (faster soluble salt)","Combination with codeine","Topical gel 5%","Soft-gel capsule"],
        fields:["Pain","Inflammation","Fever"],
        excipNote:"Being slightly acidic, it benefits from a buffer and an enteric film coat to protect the stomach; gels need a gelling base.",
        excipTags:["CA","HPMC","PG","MgSt","HPC","cPVP"] },

      { code:"ASA", name:"Aspirin (Acetylsalicylic acid)", cat:"NSAID / Antiplatelet", bcs:"Class I (High Sol, High Perm)", forms:["Tablet","Dispersible"],
        explain:"Reduces prostaglandins for pain relief; at low dose it inhibits platelet aggregation to help prevent blood clots.",
        versions:["Enteric-coated (gut-safe)","Buffered aspirin","Dispersible soluble tablet","Low-dose 75/81mg cardioprotective"],
        fields:["Pain","Anti-clot","Inflammation"],
        excipNote:"Moisture-sensitive, so it needs a protective coating; a buffer reduces gastric irritation; disintegrants help soluble forms.",
        excipTags:["HPMC","CA","MgSt","MCC","CaSt"] },

      { code:"LDC", name:"Lidocaine", cat:"Local Anesthetic", bcs:"Class II (Low Sol, High Perm)", forms:["Injection","Topical Gel","Patch"],
        explain:"Blocks voltage-gated sodium channels in nerve membranes, preventing conduction of pain signals locally.",
        versions:["Lidocaine HCl injection","Topical 5% patch","Lidocaine + Epinephrine combination"],
        fields:["Local anesthesia","Arrhythmia"],
        excipNote:"Topical gels require gelling agents and co-solvents; injectables require pH buffering and tonicity adjusting salts.",
        excipTags:["H2O","NaCl","PG","CA","NaOH"] },

      { code:"ACT", name:"Acetone", cat:"Solvent / Antiseptic agent", bcs:"Class I (High Sol, High Perm)", forms:["Topical solution","Cleansing liquid"],
        explain:"A simple ketone compound used primarily as an organic solvent, chemical intermediate, and topical cleansing or degreasing agent in specialized dermatological preparations.",
        versions:["USP / Pharmaceutical grade","Analytical grade solution"],
        fields:["Topical antiseptic","Solvent"],
        excipNote:"Primarily handled as a liquid solvent vehicle; when formulated in topical preparations, it relies on co-solvents, preservatives, and purified water.",
        excipTags:["H2O","EtOH","PG","PHE"] },

      { code:"AMX", name:"Amoxicillin", cat:"Antibiotic", bcs:"Class III (High Sol, Low Perm)", forms:["Capsule","Suspension","IV"],
        explain:"A beta-lactam penicillin that kills bacteria by disrupting cell-wall synthesis; often paired with clavulanate to beat resistance.",
        versions:["Amoxicillin trihydrate","Amoxicillin + clavulanic acid (co-amoxiclav)","Oral suspension powder","Injectable sodium salt"],
        fields:["Bacterial infection","Respiratory","Dental"],
        excipNote:"Suspensions need suspending and sweetening agents to be palatable for children, plus a preservative for multi-dose bottles.",
        excipTags:["MCC","SUC","BKC","MC","DEX"] },

      { code:"MET", name:"Metformin", cat:"Antidiabetic", bcs:"Class III (High Sol, Low Perm)", forms:["Tablet","Extended-release tablet"],
        explain:"A biguanide that lowers blood glucose by reducing liver glucose output and improving the body's response to insulin.",
        versions:["Metformin hydrochloride IR","Extended-release (Glucophage XR)","Combination with sitagliptin"],
        fields:["Type 2 diabetes"],
        excipNote:"The extended-release form relies on a hydrophilic matrix (HPMC or HPC) that swells to release the drug slowly over the day.",
        excipTags:["HPMC","MCC","MgSt","PVP","HPC"] },

      { code:"ATV", name:"Atorvastatin", cat:"Cardiovascular (statin)", bcs:"Class II (Low Sol, High Perm)", forms:["Film-coated tablet"],
        explain:"Lowers LDL cholesterol by inhibiting HMG-CoA reductase, the enzyme that makes cholesterol in the liver.",
        versions:["Atorvastatin calcium salt","Combination with amlodipine","Combination with ezetimibe"],
        fields:["Hypercholesterolemia","Cardiovascular"],
        excipNote:"Light- and moisture-sensitive, so it needs a film coating and an antioxidant/opacity system; compactible fillers give consistent dosing.",
        excipTags:["HPMC","TiO2","MCC","MgSt","DCP"] },

      { code:"OMP", name:"Omeprazole", cat:"Gastrointestinal (PPI)", bcs:"Class II (Low Sol, High Perm)", forms:["Enteric capsule","Granules","IV"],
        explain:"A proton-pump inhibitor that blocks the H+/K+-ATPase in stomach cells, sharply reducing acid for ulcers and reflux.",
        versions:["Enteric-coated granules in capsule","OTC 10/20mg tablet","IV infusion vial","Racemic vs esomeprazole"],
        fields:["Acid reflux","Ulcers"],
        excipNote:"Omeprazole degrades in acid, so each pellet must be enteric-coated and protected from light — a coating plus opacifier are essential.",
        excipTags:["HPMC","TiO2","MCC","MgSt","HPC","EUD"] },

      { code:"SAL", name:"Salbutamol (Albuterol)", cat:"Bronchodilator", bcs:"Class I (High Sol, High Perm)", forms:["Inhaler (MDI)","Nebule","Tablet"],
        explain:"A short-acting beta-2 agonist that relaxes airway smooth muscle within minutes to relieve asthma attacks.",
        versions:["Salbutamol sulfate","Metered-dose inhaler","Nebuliser solution","Combination inhalers"],
        fields:["Asthma","COPD"],
        excipNote:"Inhalers use a propellant to aerosolise the drug; nebule solutions need a preservative and pH buffer to stay stable.",
        excipTags:["BKC","CA","NaCl","H2O"] },

      { code:"LOR", name:"Loratadine", cat:"Antihistamine", bcs:"Class II (Low Sol, High Perm)", forms:["Tablet","Syrup"],
        explain:"A second-generation H1 blocker that eases allergy symptoms with little drowsiness, because it doesn't readily enter the brain.",
        versions:["Loratadine OTC","Desloratadine (active metabolite)","Orally disintegrating tablet"],
        fields:["Allergy","Hayfever"],
        excipNote:"Simple tablets need only a compactible filler and a lubricant; the syrup uses a sweetener and preservative.",
        excipTags:["MCC","LAC","MgSt","SUC","cSiO2"] },

      { code:"SER", name:"Sertraline", cat:"Antidepressant (SSRI)", bcs:"Class I (High Sol, High Perm)", forms:["Tablet","Liquid concentrate"],
        explain:"A selective serotonin reuptake inhibitor that raises serotonin levels in the brain, improving mood and easing anxiety.",
        versions:["Sertraline hydrochloride","Oral concentrate","Combination extensions"],
        fields:["Depression","Anxiety","OCD"],
        excipNote:"Tablets use a compactible filler and a film coat to mask taste and protect the slightly hygroscopic salt.",
        excipTags:["MCC","HPMC","MgSt","LAC","cPVP"] },

      { code:"CAF", name:"Caffeine", cat:"CNS stimulant", bcs:"Class I (High Sol, High Perm)", forms:["Tablet","Combination"],
        explain:"Blocks adenosine receptors in the brain, increasing alertness and reducing the feeling of tiredness.",
        versions:["Caffeine citrate (neonatal apnea)","Analgesic combinations","Energising supplements"],
        fields:["Alertness","Pain adjunct"],
        excipNote:"Usually combined with analgesics; tablets need a binder and lubricant, and caffeine is sometimes anhydrous for stability.",
        excipTags:["MCC","MgSt","LAC","PVP","DEX"] },

      { code:"FAM", name:"Famotidine", cat:"H2 antagonist", bcs:"Class IV (Low Sol, Low Perm)", forms:["Tablet","OTC","IV"],
        explain:"Blocks H2 receptors on stomach acid cells to reduce acid output, used for reflux and ulcers.",
        versions:["OTC 10/20mg","IV injection","Combination with antacids"],
        fields:["Acid reflux","Ulcers"],
        excipNote:"Chewable/OTC forms use sweeteners and flavours; tablets need fillers and a lubricant.",
        excipTags:["MCC","SUC","MgSt","CA","DCP"] },

      { code:"DCL", name:"Diclofenac", cat:"NSAID", bcs:"Class II (Low Sol, High Perm)", forms:["Tablet","Gel","Patch","Injection"],
        explain:"A potent COX inhibitor that relieves pain and inflammation; topical forms target local joints with less systemic exposure.",
        versions:["Diclofenac sodium (oral)","Diclofenac potassium (fast)","Topical gel 1%","Transdermal patch"],
        fields:["Pain","Inflammation","Arthritis"],
        excipNote:"Oral forms are enteric-coated to spare the stomach; gels and patches need a penetration enhancer and gelling base.",
        excipTags:["HPMC","PG","SLS","MgSt","HPC"] },

      { code:"INS", name:"Insulin", cat:"Antidiabetic (peptide)", bcs:"Class III (High Sol, Low Perm)", forms:["Injection","Pen cartridge","Pump"],
        explain:"A peptide hormone that lets cells take up glucose; injected because it would be digested if taken by mouth.",
        versions:["Rapid-acting (lispro, aspart)","Long-acting (glargine, detemir)","Human recombinant","Inhaled form"],
        fields:["Diabetes"],
        excipNote:"Being a peptide, it must be injected with a preservative (phenol or m-cresol), zinc to stabilise the hexamer, and a pH buffer to keep it soluble.",
        excipTags:["PHE","BKC","CA","NaCl","H2O","DEX"] },

      { code:"PSE", name:"Pseudoephedrine", cat:"Decongestant", bcs:"Class I (High Sol, High Perm)", forms:["Tablet","Syrup"],
        explain:"A sympathomimetic that constricts blood vessels in the nasal lining, easing a blocked nose.",
        versions:["Pseudoephedrine HCl","Extended-release 12h","Combination with antihistamines"],
        fields:["Congestion","Sinus"],
        excipNote:"Extended-release relies on a matrix former; standard tablets need fillers and a lubricant.",
        excipTags:["HPMC","MCC","MgSt","SUC"] },

      { code:"LOP", name:"Loperamide", cat:"Antidiarrheal", bcs:"Class II (Low Sol, High Perm)", forms:["Capsule","Tablet","Syrup"],
        explain:"An opioid-receptor agonist acting only in the gut; it slows bowel movement to stop diarrhoea without central effects.",
        versions:["Loperamide HCl capsules","OTC tablet","Combination with simeticone"],
        fields:["Diarrhoea"],
        excipNote:"Capsules use a gelatin shell; chewable/liquid forms need sweeteners and flavour.",
        excipTags:["GEL","MCC","MgSt","SUC"] },

      { code:"LVT", name:"Levothyroxine", cat:"Thyroid hormone", bcs:"Class III (High Sol, Low Perm)", forms:["Tablet"],
        explain:"Synthetic T4 that replaces missing thyroid hormone to restore metabolism and energy in hypothyroidism.",
        versions:["Levothyroxine sodium","Multiple strengths (25–200µg)","Liquid capsule form"],
        fields:["Hypothyroidism"],
        excipNote:"Dosed in micrograms, so it needs a very uniform filler (MCC) and careful dilution to ensure every tablet is accurate.",
        excipTags:["MCC","LAC","MgSt","StA","CaSt"] },

          description: "بر اساس استانداردهای صنعتی و تحلیلی ژاپن (معادل گرید ACS آمریکا) طراحی شده است."
        },
        applications: ["Precise quantitative analysis", "Reference analytical work", "Industrial calibration"],
        apis: ["JIS Standard Reagents", "Analytical Salts"]
      },
      {
        id: "optical",
        name: "Optical Grade",
        purity: "99.8% to 99.9%",
        focus: "Solvents for optical assays (UV-Vis) with complete light transmission",
        description: "Formulated for optical instruments to ensure total light transmission and zero fluorescence background.",
        persian: {
          name: "گرید نوری (Optical Grade)",
          purity: "خلوص شیمیایی و نوری فوق‌العاده بالا، بین 99.8% تا 99.9%",
          focus: "مخصوص حلال‌ها در دستگاه‌های سنجش نوری (مانند UV-Vis).",
          description: "با تضمین عبور کامل نور و عدم وجود پس‌زمینه مزاحم نوری یا فلوئورسانس."
        },
        applications: ["UV-Vis spectrophotometry", "Optical clearing", "Fluorescence-free assays"],
        apis: ["Optical Grade Solvents", "Spectroscopic Reagents"]
      },
      {
        id: "anhydrous",
        name: "Anhydrous Grade",
        purity: "99.0% to 99.8% (<0.005% water)",
        focus: "Water-sensitive chemical reactions (e.g., Grignard) and battery manufacturing",
        description: "Completely dehydrated to support moisture-sensitive organic synthesis and battery electrolytes.",
        persian: {
          name: "گرید بدون آب / خشک (Anhydrous Grade)",
          purity: "خلوص بسیار بالا (حدود 99.0% تا 99.8% با میزان آب کمتر از 0.005%)",
          focus: "واکنش‌های شیمیایی به‌شدت حساس به آب (مثل گرینیارد) و باتری‌سازی.",
          description: "با حذف کامل مولکول‌های آب و رطوبت جهت انجام سنتزهای خشک و حساس تهیه شده است."
        },
        applications: ["Grignard reactions", "Battery electrolyte preparation", "Moisture-sensitive synthesis"],
        apis: ["Anhydrous Solvents", "Dry Reagents"]
      },
      {
        id: "volumetric",
        name: "Volumetric Standard Grade",
        purity: "99.95% to 100.05% (Up to 4 decimal places)",
        focus: "Primary standard reference solutions/powders for volumetric titration",
        description: "Primary standard material with certified concentration for precise titrimetric analysis.",
        persian: {
          name: "گرید استاندارد حجمی (Volumetric Standard Grade)",
          purity: "دقت غلظت بسیار بالا تا ۴ رقم اعشار (پودرها بین 99.95% تا 100.05%)",
          focus: "محلول یا پودر مرجع استاندارد اولیه برای سنجش‌های حجمی و تیتراسیون دقیق.",
          description: "غلظت آن کاملاً با مراجع بین‌المللی کالیبره شده و پایه‌ای برای سنجش‌های تیتراسیون آزمایشگاهی است."
        },
        applications: ["Volumetric analysis", "Acid-base titration", "Primary standard standardization"],
        apis: ["Primary Standard Salts", "Volumetric Titration Standards"]
      }
    ];

    const PALETTE_API = {
      "Analgesic / Antipyretic":"#fde68a","NSAID":"#fecaca","NSAID / Antiplatelet":"#fecaca",
      "Solvent / Antiseptic agent":"#a5f3fc","Antibiotic":"#bbf7d0","Antidiabetic":"#bfdbfe",
      "Antidiabetic (peptide)":"#bfdbfe","Cardiovascular (statin)":"#c7d2fe","Gastrointestinal (PPI)":"#fed7aa",
      "Bronchodilator":"#a7f3d0","Antihistamine":"#ddd6fe","Antidepressant (SSRI)":"#fbcfe8",
      "CNS stimulant":"#fde68a","H2 antagonist":"#fed7aa","Diuretic / Antihypertensive":"#bfdbfe",
      "Anticoagulant":"#fecdd3","Decongestant":"#bbf7d0","Antidiarrheal":"#fed7aa",
      "Thyroid hormone":"#e0e7ff","Angiotensin II blocker (ARB)":"#bfdbfe","Calcium channel blocker":"#a5b4fc",
      "ACE inhibitor":"#c7d2fe","Macrolide antibiotic":"#86efac","Fluoroquinolone antibiotic":"#6ee7b7",
      "Anxiolytic (benzodiazepine)":"#fbcfe8","Opioid analgesic":"#fecdd3","Anticonvulsant / Neuropathic":"#e9d5ff",
      "Loop diuretic":"#93c5fd","Beta-blocker":"#a5b4fc","Corticosteroid":"#fde68a",
      "Antiviral":"#bbf7d0","Antifungal":"#d9f99d","Antibiotic / Antiprotozoal":"#bbf7d0",
      "PDE5 inhibitor":"#fbcfe8","Antimigraine (triptan)":"#fed7aa","Leukotriene antagonist":"#a7f3d0",
      "Local Anesthetic":"#cbd5e1","Oncology / Cytotoxic":"#f472b6","Opioid Antagonist":"#fb923c",
      "Immunosuppressant":"#a78bfa","Vitamin / Nutritional":"#facc15"
    };

    const PALETTE_EXC = {
      "Binders":"#c7d2fe",
      "Fillers & Diluents":"#e0e7ff",
      "Disintegrants":"#bbf7d0",
      "Lubricants":"#fed7aa",
      "Glidants":"#fef3c7",
      "Coating Agents":"#bfdbfe",
      "Sweeteners & Flavoring":"#fde68a",
      "Coloring Agents":"#fecaca",
      "Preservatives":"#fbcfe8",
      "Antioxidants":"#fed7aa",
      "Buffers & pH Adjusters":"#ddd6fe",
      "Solvents & Vehicles":"#a5f3fc",
      "Surfactants & Emulsifiers":"#a7f3d0",
      "Stabilizers":"#f3e8ff",
      "Humectants":"#bae6fd",
      "Controlled-Release Agents":"#c7d2fe",
      "Suspending & Thickening Agents":"#e0f2fe"
    };

    function colorOf(v,cat){ return (v==="api"?PALETTE_API:PALETTE_EXC)[cat] || "#e2e8f0"; }

    let view="api";
    let selIndex=0;
    let selectedGradeIndex=0;
    let query="";
    let activeCat=null;

    const $ = id => document.getElementById(id);
    const gridEl=$("grid"), legendEl=$("legend"), detailEl=$("detail"), hintEl=$("hint");

    function data(){ return view==="api"?API:EXC; }
    function palette(){ return view==="api"?PALETTE_API:PALETTE_EXC; }

    function matches(it){
      if(activeCat && it.cat!==activeCat) return false;
      if(!query) return true;
      const q=query.toLowerCase();
      return (it.name+it.code+it.cat).toLowerCase().includes(q);
    }

    function updateHash(){
      if(view === "grades") {
        window.location.hash = `grades/${gradesData[selectedGradeIndex].id}`;
      } else {
        const item = data()[selIndex];
        if(item) {
          window.location.hash = `${view}/${item.code}`;
        }
      }
    }

    function buildLegend(){
      const pal=palette();
      const cats=Object.keys(pal);
      legendEl.innerHTML="";
      cats.forEach(c=>{
        const has=data().some(d=>d.cat===c);
        const el=document.createElement("div");
        el.className="chip"+(activeCat===c?" on":(activeCat?" muted":""))+(!has?" muted":"");
        el.innerHTML=`<span class="dot" style="background:${pal[c]}"></span>${c}`;
        el.onclick=()=>{
          activeCat=(activeCat===c)?null:c;
          render();
        };
        legendEl.appendChild(el);
      });
    }

    function renderGrid(){
      gridEl.innerHTML="";
      data().forEach((it,i)=>{
        const ok=matches(it);
        const catColor = colorOf(view, it.cat);
        const t=document.createElement("button");
        t.className="tile"+(i===selIndex?" sel":"")+(!ok?" dim":"");
        t.style.borderLeft = `4px solid ${catColor}`;
        t.innerHTML=`
          <div class="element-header">
            <div class="code">${it.code}</div>
            <span class="cat-indicator" style="background:${catColor}"></span>
          </div>
          <div class="nm">${it.name.replace(/\s*\(.*?\)\s*/g," ")}</div>
          <div class="cat">${it.cat}</div>`;
        t.onclick=()=>{ selIndex=i; updateHash(); render(); };
        gridEl.appendChild(t);
      });
    }

    function renderDetail(){
      const it=data()[selIndex];
      if(!it){ detailEl.innerHTML='<div class="empty">No item selected.</div>'; return; }
      const col=colorOf(view,it.cat);
      if(view==="api"){
        const forms=it.forms.map(f=>`<span class="pill">${f}</span>`).join("");
        const versions=it.versions.map(v=>`<li>${v}</li>`).join("");
        const fields=it.fields.map(f=>`<span class="tag">${f}</span>`).join("");

        let warnHtml = "";
        it.excipTags.forEach(code=>{
          const match = INCOMPATIBILITIES.find(x=>x.api===it.code && x.exc===code);
          if(match) {
            warnHtml += `<div class="warn-box"><strong>⚠️ Formulative Incompatibility (${code})</strong>${match.reason}</div>`;
          }
        });

        const tags=it.excipTags.map(code=>{
          const e=EXC.find(x=>x.code===code);
          return e?`<span class="tag link" data-code="${code}">${e.name}</span>`:`<span class="tag">${code}</span>`;
        }).join("");

        detailEl.innerHTML=`
          <div class="det-head">
            <div class="badge" style="background:${col}">${it.code}</div>
            <div>
              <h2>${it.name}</h2>
              <div class="cat">${it.cat}</div>
              <div class="forms">${forms}</div>
            </div>
          </div>
          <div class="h3">Pharmacokinetics</div>
          <span class="tag bcs">${it.bcs}</span>
          <div class="h3">What it does</div>
          <p class="p">${it.explain}</p>
          ${warnHtml}
          <div class="h3">Modified versions</div>
          <ul class="versions">${versions}</ul>
          <div class="h3">Fields of use</div>
          <div class="tags">${fields}</div>
          <div class="h3">Typical excipients to deliver & stabilise it</div>
          <p class="note">${it.excipNote}</p>
          <div class="tags">${tags}</div>`;
        detailEl.querySelectorAll(".tag.link").forEach(el=>{
          el.onclick=()=>jumpToExcip(el.dataset.code);
        });
      } else {
        const forms=it.forms.map(f=>`<span class="pill">${f}</span>`).join("");

        let warnHtml = "";
        INCOMPATIBILITIES.filter(x=>x.exc===it.code).forEach(match=>{
          warnHtml += `<div class="warn-box"><strong>⚠️ Known Incompatibility with ${match.api}</strong>${match.reason}</div>`;
        });

        detailEl.innerHTML=`
          <div class="det-head">
            <div class="badge" style="background:${col}">${it.code}</div>
            <div>
              <h2>${it.name}</h2>
              <div class="cat">${it.cat}</div>
              <div class="forms">${forms}</div>
            </div>
          </div>
          <div class="h3">What it does</div>
          <p class="p">${it.explain}</p>
          ${warnHtml}
          ${modSection(it.code)}
          <div class="h3">Where you'll find it</div>
          <div class="tags">${forms}</div>
          <div class="h3">APIs that commonly rely on it</div>
          <div class="tags">${excipUsageTags(it.code)}</div>
          <p class="hint">Click an API chip to jump to that entry.</p>`;
        detailEl.querySelectorAll(".tag.link").forEach(el=>{
          el.onclick=()=>jumpToApi(el.dataset.code);
        });
      }
    }

    function excipUsageTags(code){
      const uses=API.filter(a=>(a.excipTags||[]).includes(code));
      if(!uses.length) return '<span class="tag">Various formulations</span>';
      return uses.map(a=>`<span class="tag link" data-code="${a.code}">${a.name.replace(/\s*\(.*?\)\s*/g," ")}</span>`).join("");
    }

    function modSection(code){
      const list=MODIFIED[code]||[];
      if(!list.length) return "";
      const items=list.map(m=>{
        const i=m.indexOf("(");
        if(i<0) return `<li><span class="mod-nm">${m}</span></li>`;
        return `<li><span class="mod-nm">${m.slice(0,i).trim()}</span> <span class="mod-abbr">${m.slice(i).trim()}</span></li>`;
      }).join("");
      return `<div class="h3">Chemically modified versions</div><ul class="versions mod-list">${items}</ul>`;
    }

    function renderGrades(){
      const sidebar = document.getElementById('gradesList');
      if(!sidebar) return;
      sidebar.innerHTML = '';
      
      gradesData.forEach((grade, index) => {
        const item = document.createElement('div');
        item.className = `grade-item ${index === selectedGradeIndex ? 'active' : ''}`;
        item.onclick = () => {
          selectedGradeIndex = index;
          updateHash();
          renderGrades();
        };
        
        item.innerHTML = `
          <span>${grade.name}</span>
          <span class="grade-badge">${grade.purity.split(' ')[0]}</span>
        `;
        sidebar.appendChild(item);
      });
      
      if(gradesData.length > 0) {
        displayGradeDetails(gradesData[selectedGradeIndex]);
      }
    }

    function displayGradeDetails(grade) {
      const panel = document.getElementById('gradeDetailsBox');
      if(!panel) return;
      
      let applicationsTags = grade.applications.map(app => `<span class="tag">${app}</span>`).join('');
      let apisTags = grade.apis.map(api => `<span class="tag api-tag">${api}</span>`).join('');
      
      panel.innerHTML = `
          <div class="det-head" style="margin-bottom:16px;">
            <div>
              <h2>${grade.name}</h2>
              <div class="cat" style="margin-top:4px;">Primary Intent: ${grade.focus}</div>
            </div>
          </div>
          
          <div style="margin-bottom:16px;">
            <div class="meta-box">Assigned Purity: ${grade.purity}</div>
          </div>
          
          <div class="h3">Grade Characterization Overview</div>
          <p class="p">${grade.description}</p>
          
          <div class="h3">Target Operational Applications</div>
          <div class="tag-container" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">${applicationsTags}</div>
          
          <div class="h3">Examples of Compatible Reference APIs / Compounds</div>
          <div class="tag-container" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">${apisTags}</div>

          <div class="persian-box">
            <strong style="display:block;margin-bottom:6px;color:var(--sky);">توضیحات و ترجمه فارسی:</strong>
            <div style="font-weight:600;margin-bottom:4px;">نام گرید: ${grade.persian.name}</div>
            <div style="margin-bottom:4px;"><strong>میزان خلوص:</strong> ${grade.persian.purity}</div>
            <div style="margin-bottom:4px;"><strong>کاربرد اصلی:</strong> ${grade.persian.focus}</div>
            <div><strong>شرح کاربرد:</strong> ${grade.persian.description}</div>
          </div>
      `;
    }

    // --- Added Navigation Helper Functions ---
    function jumpToExcip(code){
      const i=EXC.findIndex(e=>e.code===code);
      if(i<0) return;
      view="exc"; activeCat=null;
      document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.view==='exc'));
      selIndex=i; updateHash(); render(); window.scrollTo({top:0,behavior:'smooth'});
    }
    
    function jumpToApi(code){
      const i=API.findIndex(e=>e.code===code);
      if(i<0) return;
      view="api"; activeCat=null;
      document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.view==='api'));
      selIndex=i; updateHash(); render(); window.scrollTo({top:0,behavior:'smooth'});
    }
    // ----------------------------------------

    function parseHash(){
      const h = window.location.hash.replace("#","");
      if(!h) return;
      const [v, code] = h.split("/");
      if(v === "api" || v === "exc") {
        view = v;
        document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
        const arr = data();
        const idx = arr.findIndex(x=>x.code===code);
        if(idx >= 0) selIndex = idx;
      } else if(v === "grades") {
        view = "grades";
        document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.view==="grades"));
        const idx = gradesData.findIndex(x=>x.id===code);
        if(idx >= 0) selectedGradeIndex = idx;
      }
    }

    function render(){
      const mainLayout = $("main-layout");
      const gradesLayout = $("grades-layout");
      
      document.querySelectorAll('#seg button').forEach(b=>{
        b.classList.toggle('on', b.dataset.view === view);
      });

      if(view === "grades"){
        if(mainLayout) mainLayout.style.display = "none";
        if(gradesLayout) gradesLayout.style.display = "grid";
        renderGrades();
        hintEl.textContent = "Chemical & Pharma Grades = purity tiers, analytical specifications, and regulatory benchmarks for raw materials and solvents.";
      } else {
        if(mainLayout) mainLayout.style.display = "grid";
        if(gradesLayout) gradesLayout.style.display = "none";
        buildLegend();
        renderGrid();
        renderDetail();
        hintEl.textContent = view==="api"
          ? "APIs = the active drug molecule. Select one to see what it does, its BCS class, and excipient interactions."
          : "Excipients = inactive ingredients that deliver, protect or preserve the API in pills, capsules and injections.";
      }
    }

    $("seg").addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.view===view) return;
      view=b.dataset.view; activeCat=null; query=""; $("q").value="";
      selIndex=0; updateHash(); render();
    });
    $("q").addEventListener("input",e=>{ query=e.target.value.trim(); if(view !== "grades") renderGrid(); });

    const themeBtn=$("theme");
    function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("pharma-theme",t)}catch(e){} }
    try{ const saved=localStorage.getItem("pharma-theme"); if(saved) applyTheme(saved); }catch(e){}
    themeBtn.addEventListener("click",()=>{
      const cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
      applyTheme(cur);
    });

    window.addEventListener("hashchange", ()=>{ parseHash(); render(); });
    parseHash();
    render();
  </script>
  </body>
</html>
